<!DOCTYPE html>
<html lang="zh-CN" data-taskplugin-host="sidepanel">
<head>
  <meta charset="utf-8">
  <meta name="trae-service" content="taskChromePlugin" />
  <title>云端Coding: 自动创新助手</title>
  <link rel="stylesheet" href="../content/content.css">
  <link rel="stylesheet" href="../content/content-form.css">
  <link rel="stylesheet" href="../popup/popup.css">
  <!-- 本机模型页签与设置 iframe 共用浅色覆盖；勿省略，否则 popup.css 深色底会漏到 #sp-pane-builtin -->
  <link rel="stylesheet" href="../popup/popup-sidepanel.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sp-shell">
    <div class="sp-tabs" role="tablist" aria-label="侧边栏">
      <!-- Anti-Replay-OK: ui-only — 只切换已挂载的页签，不发写请求 -->
      <button type="button" class="sp-tab" id="sp-tab-create" role="tab" aria-selected="false" aria-controls="sp-pane-create">创建任务</button>
      <button type="button" class="sp-tab" id="sp-tab-settings" role="tab" aria-selected="true" aria-controls="sp-pane-settings">设置</button>
      <button type="button" class="sp-tab" id="sp-tab-builtin" role="tab" aria-selected="false" aria-controls="sp-pane-builtin" data-i18n="paBuiltinTab" data-testid="sp-tab-builtin">本机模型</button>
    </div>
    <div id="sp-pane-create" class="sp-pane" role="tabpanel" hidden></div>
    <div id="sp-pane-settings" class="sp-pane" role="tabpanel">
      <iframe id="sp-settings-frame" title="设置" src="../popup/popup.html?host=sidepanel"></iframe>
    </div>
    <div id="sp-pane-builtin" class="sp-pane" role="tabpanel" hidden data-testid="sp-pane-builtin">
      <section class="section builtin-full-panel" id="spBuiltinPanel">
        <h3 data-i18n="paBuiltinTab">本机模型</h3>
        <p id="spBuiltinStatus" class="hint" aria-live="polite"></p>
        <div class="btn-row">
          <!-- Anti-Replay-OK: ui-only LanguageModel probe -->
          <button type="button" id="spBuiltinRefresh" class="btn btn-sm" data-i18n="paBuiltinRefresh">刷新状态</button>
          <button type="button" id="spBuiltinDownload" class="btn btn-sm" data-i18n="paBuiltinDownload" hidden>下载模型</button>
          <button type="button" id="spBuiltinCancel" class="btn btn-sm" data-i18n="paBuiltinCancelDownload" hidden>取消下载</button>
        </div>
        <div class="form-row">
          <label data-i18n="paBuiltinParamsLabel">采样参数</label>
          <p id="spBuiltinParams" class="hint">—</p>
        </div>
        <div class="form-row">
          <label data-i18n="paBuiltinQuotaLabel">上下文配额</label>
          <p id="spBuiltinQuota" class="hint">—</p>
        </div>
        <div class="form-row">
          <label data-i18n="paBuiltinLastRunLabel">最近一次本机运行</label>
          <p id="spBuiltinLastRun" class="hint">—</p>
        </div>
        <p id="spBuiltinInternalsHint" class="hint">
          <span data-i18n="paBuiltinOnDeviceInternalsLead">高级排障请打开 </span>
          <!-- Anti-Replay-OK: navigation only — chrome.tabs.create 打开 chrome:// 页 -->
          <a href="#" id="spBuiltinInternalsLink">chrome://on-device-internals</a>
          <span data-i18n="paBuiltinOnDeviceInternalsCaution">。请谨慎修改其中参数；搞错后可能无法再使用本机模型。</span>
        </p>
      </section>

      <!-- 本机模型出售：登录后可见；注册指纹 + 出站保活（ADR-0130/0132） -->
      <section id="builtinEdgeSellSection" class="section" style="display:none" hidden data-testid="builtin-edge-sell-plugin">
        <div class="advisor-defaults-heading">
          <h3>📡 <span data-i18n="builtinEdgeSellTitle">本机模型出售</span></h3>
          <details class="region-help">
            <summary class="region-help-mark" data-i18n-aria-label="regionHelpToggleAria" aria-label="功能说明">!</summary>
            <p class="float-ball-hint" data-region-help="1" data-i18n="builtinEdgeSellHint">先在账号中心「本机模型出售」创建出售项目，再在下方下拉选择项目完成注册。插件会主动连接平台保活（无需公网 IP），平台才能把请求转到本机内置模型。</p>
          </details>
        </div>
        <p class="hint" data-testid="builtin-edge-fingerprint-line">
          <span data-i18n="builtinEdgeFingerprintLabel">本机插件指纹</span>:
          <code id="builtinEdgeFingerprint" class="select-all">—</code>
        </p>
        <div id="builtinEdgeSellRegisterPanel" data-testid="builtin-edge-sell-register-panel">
          <label class="form-row">
            <span data-i18n="builtinEdgeProjectIdLabel">出售项目</span>
            <select id="builtinEdgeProjectId" class="form-select" data-testid="builtin-edge-project-id" data-i18n-aria-label="builtinEdgeProjectIdLabel" aria-label="出售项目"></select>
          </label>
          <label class="form-row">
            <span data-i18n="builtinEdgeDeviceLabel">设备备注（可选）</span>
            <input type="text" id="builtinEdgeDeviceLabel" class="form-input" data-testid="builtin-edge-device-label" autocomplete="off" />
          </label>
          <div class="btn-row">
            <button type="button" id="btnBuiltinEdgeRegister" class="btn btn-primary" data-testid="builtin-edge-register" data-i18n="builtinEdgeRegister">注册本机到项目</button>
          </div>
        </div>
        <div id="builtinEdgeSellRegisteredPanel" class="builtin-edge-registered" style="display:none" hidden data-testid="builtin-edge-sell-registered-panel">
          <h4 class="heading-sm" data-i18n="builtinEdgeRegistrationTitle">当前注册情况</h4>
          <ul id="builtinEdgeRegistrationLines" class="hint-list" data-testid="builtin-edge-registration-lines"></ul>
          <h4 class="heading-sm" data-i18n="builtinEdgeCallStatsTitle">调用情况</h4>
          <ul id="builtinEdgeCallLines" class="hint-list" data-testid="builtin-edge-call-lines"></ul>
          <div class="btn-row">
            <button type="button" id="btnBuiltinEdgeUnregister" class="btn btn-danger" data-testid="builtin-edge-unregister" data-i18n="builtinEdgeUnregister">取消注册</button>
          </div>
        </div>
        <p id="builtinEdgeSellStatus" class="hint" aria-live="polite" data-testid="builtin-edge-sell-status"></p>
      </section>
    </div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/i18n-messages.js"></script>
  <script src="../lib/i18n-ui-messages.js"></script>
  <script src="../lib/i18n-llm-route.js"></script>
  <script src="../lib/i18n-tx.js"></script>
  <script src="../lib/hot-path-guards.js"></script>
  <script src="../lib/page-advisor-locale-prompt.js"></script>
  <script src="../lib/page-advisor-builtin-runtime.js"></script>
  <script src="../lib/page-advisor-builtin-prompt.js"></script>
  <script src="../lib/side-panel-bridge.js"></script>
  <script src="../lib/open-chrome-url.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/api-http.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/click-guard.js"></script>
  <script src="../lib/plugin-install-fingerprint.js"></script>
  <script src="../lib/builtin-edge-registration-recover.js"></script>
  <script src="../lib/builtin-edge-node-join.js"></script>
  <script src="../lib/builtin-edge-supported-models.js"></script>
  <script src="../lib/builtin-edge-tunnel.js"></script>
  <script src="../lib/popup-builtin-edge-sell.js"></script>
  <script src="../popup/popup-builtin-edge-sell.js"></script>
  <script src="builtin-model-panel.js"></script>
  <script src="sidepanel-edge-sell-boot.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
