<!DOCTYPE html>
<html lang="zh-CN" id="tcp-panel-root">
<head>
  <meta charset="utf-8">
  <meta name="trae-service" content="taskChromePlugin" />
  <title data-i18n="extTitle">云端Coding: 自动创新助手</title>
  <link rel="stylesheet" href="panel.css">
  <!--
    DevTools postMessage 消息入口（initRequests / newRequest / requestUpdated）已在
    panel.js bindRequestMessagePipeline() 中统一注册。切勿改回内联 <script> ——
    MV3 扩展页面 CSP (script-src 'self') 会阻止内联脚本，导致 devtools 请求列表为空。
  -->
</head>
<body>
  <div id="app">
    <!-- 头部状态 -->
    <header class="header">
      <h1>🔧 <span data-i18n="extTitle">云端Coding: 自动创新助手</span></h1>
      <div class="header-right">
        <!-- Anti-Replay-OK: locale switch; PATCH profile is best-effort (ADR-0089) -->
        <label class="plugin-locale-wrap">
          <span class="visually-hidden" data-i18n="pluginLocaleLabel">语言</span>
          <select id="pluginLocaleSelect" class="form-select plugin-locale-select" data-testid="plugin-locale-select" data-i18n-aria-label="pluginLocaleLabel" aria-label="语言">
            <option value="zh-CN" data-i18n="pluginLocaleZh">中文</option>
            <option value="en" data-i18n="pluginLocaleEn">English</option>
          </select>
        </label>
        <span id="statusBadge" class="badge badge-disconnected" data-i18n="panelBadgeDisconnected">未连接</span>
        <!-- OPT-20260921-023: 与 Popup 同源（lib/plugin-version.js），排障时可直接对照 GitHub Release -->
        <span id="panelVersion" class="badge panel-version" aria-live="polite" hidden></span>
      </div>
    </header>

    <!-- Tab 切换 -->
    <nav class="tabs">
      <button class="tab active" data-tab="single" data-i18n="panelTabSingle">📋 单请求创建</button>
      <button class="tab" data-tab="batch" data-i18n="panelTabBatch">📦 批量错误捕获</button>
      <button class="tab" data-tab="errors" data-i18n="panelTabErrors">⚠️ 错误列表</button>
      <button class="tab" data-tab="history" data-i18n="panelTabHistory">📜 历史记录</button>
      <button class="tab" data-tab="guide" data-i18n="panelTabGuide">📖 使用说明</button>
    </nav>

    <!-- Tab: 单请求创建 -->
    <section id="tab-single" class="tab-content active">
      <!-- 请求列表 + 选中预览 -->
      <div class="section">
        <h3><span data-i18n="panelRequestListTitle">📌 请求列表</span> <span class="hint-inline" data-i18n="panelFromDevToolsNetwork">(来自 DevTools Network)</span></h3>
        <!-- 搜索栏 -->
        <div class="search-bar">
          <input type="text" id="requestSearch" class="form-input search-input" data-i18n-placeholder="panelSearchRequests" placeholder="🔍 搜索 URL / 方法 / 状态码...">
          <select id="requestMethodFilter" class="form-select search-select">
            <option value="" data-i18n="panelAllMethods">全部方法</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
            <option value="PATCH">PATCH</option>
            <option value="OPTIONS">OPTIONS</option>
            <option value="HEAD">HEAD</option>
          </select>
          <select id="requestStatusFilter" class="form-select search-select">
            <option value="" data-i18n="panelAllStatus">全部状态</option>
            <option value="2xx" data-i18n="panelStatus2xx">2xx 成功</option>
            <option value="3xx" data-i18n="panelStatus3xx">3xx 重定向</option>
            <option value="4xx" data-i18n="panelStatus4xx">4xx 客户端错误</option>
            <option value="5xx" data-i18n="panelStatus5xx">5xx 服务端错误</option>
            <option value="canceled" data-i18n="panelStatusCanceled">Canceled 已取消</option>
          </select>
        </div>
        <!-- Anti-Replay-OK: local view query only — type chips do not POST -->
        <div id="requestTypeFilters" class="request-type-filters" role="group" aria-label="资源类型" data-i18n-aria-label="panelResourceTypes">
          <button type="button" class="type-chip active" data-type="" aria-pressed="true" data-i18n="all">全部</button>
          <button type="button" class="type-chip" data-type="xhr" aria-pressed="false">XHR</button>
          <button type="button" class="type-chip" data-type="doc" aria-pressed="false">Doc</button>
          <button type="button" class="type-chip" data-type="js" aria-pressed="false">JS</button>
          <button type="button" class="type-chip" data-type="css" aria-pressed="false">CSS</button>
          <button type="button" class="type-chip" data-type="img" aria-pressed="false">Img</button>
          <button type="button" class="type-chip" data-type="other" aria-pressed="false">Other</button>
        </div>
        <div class="btn-row">
          <button id="btnRefreshRequest" data-i18n="panelRefreshList" class="btn btn-sm">🔄 刷新列表</button>
          <button id="btnClearRequestList" class="btn btn-sm btn-danger" data-i18n-title="panelClearListTitle" title="清空本面板与后台缓存的请求列表（不影响 Network 面板）"><span data-i18n="panelClearList">🗑️ 清空列表</span></button>
          <span id="requestCount" class="hint-inline"></span>
        </div>
        <!-- Anti-Replay-OK: local view query only — column headers sort in-memory list -->
        <div class="request-list-header" role="row">
          <button type="button" class="req-sort" data-sort="method" data-i18n="panelColMethod">方法</button>
          <button type="button" class="req-sort" data-sort="status" data-i18n="panelColStatus">状态</button>
          <button type="button" class="req-sort req-sort-url" data-sort="url" data-i18n="panelColUrl">URL</button>
          <button type="button" class="req-sort" data-sort="time" data-i18n="panelColTime">耗时</button>
          <button type="button" class="req-sort" data-sort="timestamp" aria-sort="descending" data-i18n="panelColTimestamp">时间</button>
        </div>
        <div id="selectedRequest" class="request-preview empty">
          <p class="placeholder" data-i18n="panelLoadingRequests">正在加载请求列表...</p>
        </div>
      </div>

      <!-- 工作空间 & 项目选择 -->
      <div class="section">
        <h3 data-i18n="panelWorkspace">🗂️ 工作空间</h3>
        <div class="target-row">
          <select id="singleWorkspace" class="form-select" style="flex:2">
            <option value="" data-i18n="panelSelectWorkspace">-- 请选择工作空间 --</option>
          </select>
          <select id="singleProgressColumn" class="form-select" style="flex:1">
            <option value="" data-i18n="panelProgressColumn">进度列</option>
          </select>
          <select id="singlePriority" class="form-select" style="flex:1">
            <option value="0" data-i18n="panelPriorityHigh">高</option>
            <option value="1" selected data-i18n="panelPriorityMedium">中</option>
            <option value="2" data-i18n="panelPriorityLow">低</option>
          </select>
          <select id="singleOwner" class="form-select" style="flex:2">
            <option value="" data-i18n="panelOwner">负责人</option>
          </select>
        </div>
        <div id="singleProjects" class="checkbox-group" style="margin-top:6px" role="radiogroup" aria-label="项目（单选）" data-i18n-aria-label="panelProjectSingleAria" aria-required="true">
          <p class="placeholder" data-i18n="panelProjectSingle">项目 (单选)</p>
        </div>
        <p id="panel-aidev-status" class="hint-inline" hidden style="margin-top:6px"></p>
      </div>

      <!-- 分支策略 -->
      <div class="section">
        <h3 data-i18n="panelBranchStrategy">🌿 分支策略</h3>
        <div class="target-row">
          <div style="flex:1">
            <label><span data-i18n="panelWorkBranch">工作分支</span> <span class="hint-inline" data-i18n="panelWorkBranchHint">— 选择模板或输入分支名</span></label>
            <input type="text" id="singleWorkBranch" class="form-input" data-i18n-placeholder="panelWorkBranchPlaceholder" placeholder="选择模板或输入分支名" list="singleWorkBranchList">
            <datalist id="singleWorkBranchList"></datalist>
          </div>
          <div style="flex:1">
            <label><span data-i18n="panelMergeTarget">合并目标分支</span> <span class="hint-inline" data-i18n="panelWorkBranchHint">— 选择模板或输入分支名</span></label>
            <div class="target-row" style="gap:4px">
              <input type="text" id="singleMergeTarget" class="form-input" style="flex:1" data-i18n-placeholder="panelMergePlaceholder" placeholder="如: main, develop" list="singleMergeTargetList">
              <button id="btnRefreshSingleBranches" class="btn btn-sm" data-i18n-title="panelRefreshBranchesTitle" title="从 Git 仓库刷新分支列表（工作分支 + 合并目标）">🔄</button>
            </div>
            <datalist id="singleMergeTargetList"></datalist>
          </div>
        </div>
        <div class="form-row" style="margin-top:8px">
          <label><span data-i18n="panelBaseBranch">基准分支</span> <span class="hint-inline" data-i18n="panelBaseBranchHint">— 空则用项目默认分支</span></label>
          <div id="singleRepoBases" class="repo-bases">
            <p class="placeholder" data-i18n="panelBaseBranchPlaceholder">空则用项目默认分支</p>
          </div>
        </div>
      </div>

      <!-- 对齐 work-panel 的创建参数 -->
      <div class="section">
        <h3><span data-i18n="panelCreateParams">⚙️ 创建参数</span> <span class="hint-inline" data-i18n="panelCreateParamsHint">— 与工作面板创建任务一致</span></h3>
        <div class="target-row">
          <div style="flex:1">
            <label data-i18n="panelDeliverable">交付物类别</label>
            <select id="singleDeliverable" class="form-select">
              <option value="" data-i18n="commonLoading">加载中...</option>
            </select>
          </div>
          <div style="flex:1">
            <label><span data-i18n="panelInstalledImage">已安装镜像</span> <span id="singleImageRequired" class="hint-inline" hidden style="color:#f38ba8;" data-i18n="panelAutoRunRequired">*自动运行必选</span></label>
            <select id="singleContainerImage" class="form-select">
              <option value="" data-i18n="panelNone">无</option>
            </select>
          </div>
        </div>
        <div class="target-row" style="margin-top:6px">
          <div style="flex:1">
            <label><span data-i18n="panelFeatureParams">智能体资源配置</span> <span class="hint-inline" data-i18n="panelFeatureParamsHint">— 绑定镜像后必填</span></label>
            <select id="singleFeatureParamsSource" class="form-select">
              <option value="" data-i18n="panelSelectOption">-- 请选择 --</option>
              <option value="company" data-i18n="panelCompanyDefault">公司默认</option>
              <option value="workspace" data-i18n="panelWorkspaceDefault">工作空间默认</option>
              <option value="personal" data-i18n="panelPersonalConfig">个人配置</option>
            </select>
          </div>
          <div style="flex:1" id="singlePersonalConfigWrap" hidden>
            <label data-i18n="panelPersonalConfig">个人配置</label>
            <select id="singlePersonalConfig" class="form-select">
              <option value="" data-i18n="panelSelectPersonalConfig">-- 请选择个人配置 --</option>
            </select>
          </div>
          <div style="flex:1">
            <label data-i18n="panelDueDate">截止日期</label>
            <input type="datetime-local" id="singleDueDate" class="form-input">
          </div>
        </div>
        <div class="form-row" style="margin-top:6px">
          <label class="toggle-label">
            <input type="checkbox" id="singleAutoRun" disabled aria-disabled="true">
            <span>
              <span data-i18n="panelAutoRun">是否自动运行</span>
              <span class="hint-inline" id="singleAutoRunHint" data-i18n="panelAutoRunHintPickProject">请先选择项目</span>
            </span>
          </label>
        </div>
        <div class="form-row" id="singleQueuedAutoRunWrap" hidden>
          <label class="toggle-label" for="singleQueuedAutoRun">
            <input type="checkbox" id="singleQueuedAutoRun" aria-describedby="singleQueuedAutoRunHint">
            <span>
              <span data-i18n="panelQueuedAutoRun">加入自动调度队列</span>
              <span class="hint-inline" id="singleQueuedAutoRunHint" data-i18n="panelQueuedAutoRunHint">工作空间已启用自动调度。勾选后任务进入排队，按调度时段逐个启动，创建后不立即启服。不勾选则仍立即按运行模版启动。</span>
            </span>
          </label>
          <div id="singleQueuedAutoRunError" class="result" role="alert" hidden></div>
        </div>
        <div class="form-row" id="singleGitIdentities"></div>
        <div class="form-row">
          <label data-i18n="panelCollaborators">协作人员 (可多选)</label>
          <div id="singleAssignees" class="checkbox-group">
            <p class="placeholder" data-i18n="panelLoadMembersAfterWs">选择工作空间后加载成员</p>
          </div>
        </div>
      </div>

      <!-- 任务信息编辑 -->
      <div class="section">
        <h3 data-i18n="panelTaskInfo">📝 任务信息</h3>
        <div id="singleResult" class="result"></div>
        <div class="target-row">
          <div style="flex:1">
            <label data-i18n="panelTaskTitle">标题</label>
            <input type="text" id="singleTaskTitle" class="form-input" data-i18n-placeholder="panelTaskTitlePlaceholder" placeholder="任务标题">
          </div>
          <button id="btnCreateSingle" data-i18n="panelCreateTask" class="btn btn-primary" style="flex-shrink:0;margin-top:18px">✅ 创建任务</button>
        </div>
        <div class="form-row">
          <label data-i18n="panelTaskDesc">描述</label>
          <textarea id="singleTaskDesc" class="form-textarea" rows="14" data-i18n-placeholder="panelTaskDescPlaceholder" placeholder="点击请求列表中的请求 → 自动填充"></textarea>
        </div>
      </div>
    </section>

    <!-- Tab: 批量错误捕获 -->
    <section id="tab-batch" class="tab-content">
      <!-- 捕获控制 -->
      <div class="section">
        <h3 data-i18n="panelBatchCaptureSettings">🎯 自动捕获设置</h3>
        <div class="form-row">
          <label class="toggle-label">
            <input type="checkbox" id="captureToggle">
            <span data-i18n="panelEnableCapture">启用自动请求捕获</span>
          </label>
        </div>
        <div class="form-row">
          <label data-i18n="panelCaptureStatusCodes">捕获状态码</label>
          <div class="checkbox-group horizontal" id="statusCodeFilters">
            <label><input type="checkbox" value="2xx" checked> 2xx</label>
            <label><input type="checkbox" value="3xx" checked> 3xx</label>
            <label><input type="checkbox" value="4xx" checked> 4xx</label>
            <label><input type="checkbox" value="5xx" checked> 5xx</label>
            <label><input type="checkbox" value="canceled" checked> Canceled</label>
          </div>
        </div>
        <div class="form-row">
          <span id="captureStatus" class="status-text" data-i18n="panelCaptureStopped">⏸️ 捕获已停止</span>
          <!-- 文案由批量标签页脚本 refreshCapturedCount() 经 t() 写入（默认隐藏） -->
          <span id="capturedCount" class="status-text" style="display:none"></span>
        </div>
      </div>

      <!-- 工作空间 & 项目选择 -->
      <div class="section">
        <h3 data-i18n="panelBatchTarget">🗂️ 批量创建目标</h3>
        <div class="form-row">
          <label data-i18n="panelBatchWorkspace">工作空间</label>
          <select id="batchWorkspace" class="form-select">
            <option value="" data-i18n="panelSelectWorkspace">-- 请选择工作空间 --</option>
          </select>
        </div>
        <div class="form-row">
          <label id="batchProjectsLabel" data-i18n="floatProjectLegend">项目 (单选)</label>
          <div id="batchProjects" class="checkbox-group" role="radiogroup" aria-label="项目（单选）" data-i18n-aria-label="panelProjectSingleAria" aria-required="true" aria-labelledby="batchProjectsLabel">
            <p class="placeholder" data-i18n="panelBatchPickWsFirst">请先选择工作空间</p>
          </div>
        </div>
        <div class="form-row">
          <label><span data-i18n="panelProgressColumn">进度列</span> <span class="hint-inline" data-i18n="panelProgressColumnHint">— 选择工作空间后自动加载</span></label>
          <select id="batchProgressColumn" class="form-select">
            <option value="" data-i18n="commonPickWsFirst">请先选择工作空间</option>
          </select>
        </div>
        <div class="form-row">
          <label data-i18n="panelDeliverable">交付物类别</label>
          <select id="batchDeliverable" class="form-select">
            <option value="" data-i18n="commonPickWsFirst">请先选择工作空间</option>
          </select>
        </div>
        <div class="form-row">
          <label><span data-i18n="panelInstalledImage">已安装镜像</span> <span id="batchImageRequired" class="hint-inline" hidden style="color:#f38ba8;" data-i18n="panelAutoRunRequired">*自动运行必选</span></label>
          <select id="batchContainerImage" class="form-select">
            <option value="" data-i18n="panelNone">无</option>
          </select>
        </div>
        <div class="target-row">
          <div style="flex:1">
            <label><span data-i18n="panelFeatureParams">智能体资源配置</span> <span class="hint-inline" data-i18n="panelFeatureParamsHint">— 绑定镜像后必填</span></label>
            <select id="batchFeatureParamsSource" class="form-select">
              <option value="" data-i18n="panelSelectOption">-- 请选择 --</option>
              <option value="company" data-i18n="panelCompanyDefault">公司默认</option>
              <option value="workspace" data-i18n="panelWorkspaceDefault">工作空间默认</option>
              <option value="personal" data-i18n="panelPersonalConfig">个人配置</option>
            </select>
          </div>
          <div style="flex:1" id="batchPersonalConfigWrap" hidden>
            <label data-i18n="panelPersonalConfig">个人配置</label>
            <select id="batchPersonalConfig" class="form-select">
              <option value="" data-i18n="panelSelectPersonalConfig">-- 请选择个人配置 --</option>
            </select>
          </div>
          <div style="flex:1">
            <label data-i18n="panelDueDate">截止日期</label>
            <input type="datetime-local" id="batchDueDate" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <label class="toggle-label">
            <input type="checkbox" id="batchAutoRun" disabled aria-disabled="true">
            <span>
              <span data-i18n="panelAutoRun">是否自动运行</span>
              <!-- 提示文案由 ProjectAutoRunLabel 运行期按消息键写入（见项目自动运行标签模块） -->
              <span class="hint-inline" id="batchAutoRunHint" data-i18n="panelAutoRunHintPickProject">请先选择项目</span>
            </span>
          </label>
        </div>
        <div class="form-row" id="batchQueuedAutoRunWrap" hidden>
          <label class="toggle-label" for="batchQueuedAutoRun">
            <input type="checkbox" id="batchQueuedAutoRun" aria-describedby="batchQueuedAutoRunHint">
            <span>
              <span data-i18n="panelQueuedAutoRun">加入自动调度队列</span>
              <span class="hint-inline" id="batchQueuedAutoRunHint" data-i18n="panelQueuedAutoRunHint">工作空间已启用自动调度。勾选后任务进入排队，按调度时段逐个启动，创建后不立即启服。不勾选则仍立即按运行模版启动。</span>
            </span>
          </label>
          <div id="batchQueuedAutoRunError" class="result" role="alert" hidden></div>
        </div>
        <div class="form-row" id="batchGitIdentities"></div>
        <div class="form-row">
          <label><span data-i18n="panelBaseBranch">基准分支</span> <span class="hint-inline" data-i18n="panelBatchBaseHint">— 批量任务共用；空则用项目默认分支</span></label>
          <div id="batchRepoBases" class="repo-bases">
            <p class="placeholder" data-i18n="panelBaseBranchPlaceholder">空则用项目默认分支</p>
          </div>
        </div>
        <div class="form-row">
          <label><span data-i18n="floatWorkBranch">工作分支</span> <span class="hint-inline" data-i18n="panelBatchWorkBranchHint">— 选择模板或输入分支名，所有批量任务共用</span></label>
          <input type="text" id="batchWorkBranch" class="form-input" data-i18n-placeholder="panelWorkBranchPlaceholder" placeholder="选择模板或输入分支名" list="batchWorkBranchList">
          <datalist id="batchWorkBranchList"></datalist>
        </div>
        <div class="form-row">
          <label><span data-i18n="floatMergeTarget">合并目标分支</span> <span class="hint-inline" data-i18n="panelBatchWorkBranchHint">— 选择模板或输入分支名，所有批量任务共用</span></label>
          <div class="target-row" style="gap:4px">
            <input type="text" id="batchMergeTarget" class="form-input" style="flex:1" data-i18n-placeholder="panelMergePlaceholder" placeholder="如: main, develop" list="batchMergeTargetList">
            <button id="btnRefreshBatchBranches" class="btn btn-sm" data-i18n-title="panelRefreshBranchesTitle" title="从 Git 仓库刷新分支列表（工作分支 + 合并目标）">🔄</button>
          </div>
          <datalist id="batchMergeTargetList"></datalist>
        </div>
      </div>

      <div class="btn-row">
        <button id="btnRefreshErrors" data-i18n="panelBatchRefreshErrors" class="btn">🔄 刷新错误列表</button>
        <button id="btnClearErrors" data-i18n="panelBatchClearErrors" class="btn btn-danger">🗑️ 清空错误列表</button>
        <button id="btnCreateBatch" data-i18n="panelBatchCreate" class="btn btn-primary">📦 批量创建任务</button>
      </div>
      <div id="batchResult" class="result"></div>
    </section>

    <!-- Tab: 错误列表 -->
    <section id="tab-errors" class="tab-content">
      <div class="section">
        <h3 data-i18n="panelErrorsCaptured">⚠️ 已捕获的错误请求</h3>
        <div class="btn-row">
          <button id="btnRefreshErrorList" class="btn btn-sm" data-i18n="commonRefresh">🔄 刷新</button>
          <button id="btnClearErrorList" class="btn btn-sm btn-danger" data-i18n="commonClearIcon">🗑️ 清空</button>
        </div>
        <div id="errorList" class="error-list">
          <p class="placeholder" data-i18n="panelNoErrors">暂无捕获的错误请求</p>
        </div>
      </div>
    </section>

    <!-- Tab: 历史记录 -->
    <section id="tab-history" class="tab-content">
      <div class="section">
        <h3 data-i18n="panelHistoryTitle">📜 任务创建历史</h3>
        <div class="btn-row">
          <button id="btnRefreshHistory" class="btn btn-sm" data-i18n="commonRefresh">🔄 刷新</button>
