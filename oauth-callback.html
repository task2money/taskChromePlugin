<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云端 Coding — 登录回调</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      margin: 0; background: #f5f6fa; color: #333;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 32px 40px; max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center;
    }
    .card h1 { font-size: 18px; margin: 0 0 12px; }
    .card p { font-size: 14px; color: #555; margin: 0; word-break: break-all; }
    .status-ok { color: #16a34a; }
    .status-error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔐 云端 Coding 登录</h1>
    <p id="result">正在完成授权...</p>
  </div>
  <script src="lib/oauth-callback.js"></script>
  <script src="lib/oauth-callback-boot.js"></script>
</body>
</html>
