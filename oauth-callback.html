<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OAuth 回调 — TaskPlugin</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; margin: 0;
      background: #1e1e2e; color: #cdd6f4;
    }
    .card {
      text-align: center; padding: 32px; max-width: 380px;
      background: #313244; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid #45475a; border-top-color: #89b4fa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #a6e3a1; font-size: 18px; font-weight: 600; }
    .error { color: #f38ba8; font-size: 18px; font-weight: 600; }
    .hint { font-size: 12px; color: #6c7086; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <p id="status">正在处理授权回调...</p>
    <p id="detail" class="hint"></p>
  </div>
  <script src="oauth-callback.js"></script>
</body>
</html>
